<section class="section-shell leadership-section">
  <app-section-heading
    eyebrow="Leadership & volunteering"
    title="Community Impact"
    description="Active leadership roles, volunteer work, and community contributions that extend my impact beyond code."
  ></app-section-heading>

  <div class="timeline">
    @for (item of leadership; track item.role; let index = $index) {
      <article class="timeline-row" appReveal [appRevealDelay]="(index * 90) + 'ms'">
        <div class="timeline-marker">
          <span class="marker-icon">
            <i class="{{ item.iconClass }}" aria-hidden="true"></i>
          </span>
        </div>

        <div class="timeline-card glass-card" appInteractiveCard [appInteractiveCard]="8" [appInteractiveScale]="1.014">
          <div class="timeline-header">
            <div>
              <h3>
                {{ item.role }}
                @if (item.badge) {
                  <span class="timeline-badge">{{ item.badge }}</span>
                }
              </h3>
              <p class="timeline-org">{{ item.organization }}</p>
            </div>

            <span class="timeline-period">{{ item.period }}</span>
          </div>

          <p class="timeline-summary">{{ item.summary }}</p>

          <ul class="bullet-list timeline-list">
            @for (bullet of item.bullets; track bullet) {
              <li>{{ bullet }}</li>
            }
          </ul>
        </div>
      </article>
    }
  </div>
</section>
