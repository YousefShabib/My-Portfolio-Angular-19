<footer class="footer">
  <div class="footer-shell">
    <div class="footer-brand">
      <img src="assets/Logo1.jpeg" alt="Yousef Shabib logo" width="72" height="72" />
      <span>{{ person.name }}</span>
    </div>

    <p class="footer-copy">
      © 2026 {{ person.name }} · Frontend Developer · QA Engineer · UX/UI Designer
    </p>

    <div class="footer-socials">
      @for (link of socialLinks; track link.label) {
        <a appMagnetic [appMagnetic]="14" [href]="link.href" [attr.aria-label]="'Open ' + link.label" target="_blank" rel="noopener noreferrer">
          <i class="{{ link.iconClass }}" aria-hidden="true"></i>
        </a>
      }
    </div>
  </div>
</footer>
