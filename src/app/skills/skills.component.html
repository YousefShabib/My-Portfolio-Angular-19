<section class="section-shell skills-section">
  <app-section-heading
    eyebrow="Skills"
    title="Technical Toolkit"
    description="Languages, frameworks, testing tools, and design systems I work with daily."
    [centered]="false"
  ></app-section-heading>

  <div class="skills-grid">
    @for (group of skillGroups; track group.title; let index = $index) {
      <article class="skill-card glass-card" appReveal appInteractiveCard [appInteractiveCard]="11" [appInteractiveScale]="1.02" [appRevealDelay]="(index * 70) + 'ms'">
        <div class="skill-card-top">
          <span class="skill-icon">
            <i class="{{ group.iconClass }}" aria-hidden="true"></i>
          </span>
          <h3>{{ group.title }}</h3>
        </div>

        <div class="skill-tags">
          @for (item of group.items; track item) {
            <span class="chip skill-tag">{{ item }}</span>
          }
        </div>
      </article>
    }
  </div>
</section>
