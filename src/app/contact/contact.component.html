<section class="section-shell contact-section">
  <app-section-heading
    eyebrow="Contact"
    title="Let's Connect"
    description="Open to internships, freelance work, and collaborative projects. Reach out anytime."
  ></app-section-heading>

  <div class="contact-grid">
    @for (item of contactMethods; track item.label; let index = $index) {
      <article class="contact-card glass-card" appReveal appInteractiveCard [appInteractiveCard]="9" [appInteractiveScale]="1.018" [appRevealDelay]="(index * 70) + 'ms'">
        <span class="contact-icon">
          <i class="{{ item.iconClass }}" aria-hidden="true"></i>
        </span>

        <div>
          <p class="contact-label">{{ item.label }}</p>

          @if (item.href) {
            <a
              class="contact-value"
              [href]="item.href"
              [attr.target]="item.href.startsWith('http') ? '_blank' : null"
              [attr.rel]="item.href.startsWith('http') ? 'noopener noreferrer' : null"
            >
              {{ item.value }}
            </a>
          } @else {
            <p class="contact-value">{{ item.value }}</p>
          }

          <p class="contact-description">{{ item.description }}</p>
        </div>
      </article>
    }
  </div>

  <div class="contact-actions" appReveal [appRevealDelay]="'220ms'">
    <a class="button-secondary contact-action" appMagnetic [href]="person.githubUrl" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-github" aria-hidden="true"></i>
      GitHub
    </a>
    <a class="button-secondary contact-action" appMagnetic [href]="person.linkedinUrl" target="_blank" rel="noopener noreferrer">
      <i class="fa-brands fa-linkedin" aria-hidden="true"></i>
      LinkedIn
    </a>
    <a class="button contact-action" appMagnetic [href]="person.resumeUrl" target="_blank" rel="noopener noreferrer">
      <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
      My Resume
    </a>
  </div>

  <p class="contact-note">
    Based in {{ person.location }} · Open to remote and local opportunities
  </p>
</section>
