<section class="section-shell certificates-section">
  <app-section-heading
    eyebrow="Certificates"
    title="Credentials & Learning"
    description="Continuous learning through recognized online platforms, certifications, and programs."
  ></app-section-heading>

  <div class="certificates-grid">
    @for (certificate of certificates; track certificate.title; let index = $index) {
      <article
        class="certificate-card glass-card"
        [class.tone-blue]="index % 4 === 0"
        [class.tone-red]="index % 4 === 1"
        [class.tone-teal]="index % 4 === 2"
        [class.tone-violet]="index % 4 === 3"
        appReveal
        appInteractiveCard
        [appInteractiveCard]="9"
        [appInteractiveScale]="1.018"
        [appRevealDelay]="(index * 70) + 'ms'"
      >
        <div class="certificate-top">
          <div class="issuer">
            <span class="issuer-icon">
              <i class="fa-regular fa-award" aria-hidden="true"></i>
            </span>
            <span>{{ certificate.issuer }}</span>
          </div>
          <span class="certificate-date">{{ certificate.date }}</span>
        </div>

        <h3>{{ certificate.title }}</h3>

        @if (certificate.note) {
          <p class="certificate-note">
            <i class="fa-regular fa-book-open" aria-hidden="true"></i>
            {{ certificate.note }}
          </p>
        }

        @if (certificate.link) {
          <a class="certificate-link" [href]="certificate.link" target="_blank" rel="noopener noreferrer">
            <i class="fa-solid fa-arrow-up-right-from-square" aria-hidden="true"></i>
            View Certificate
          </a>
        }
      </article>
    }
  </div>
</section>
