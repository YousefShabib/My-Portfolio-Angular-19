<nav class="navbar">
  <div class="navbar-shell">
    <a class="brand" href="#home" (click)="selectNav('#home')">
      <img src="assets/Logo1.jpeg" alt="Yousef Shabib logo" width="80" height="80" />
      <span>{{ person.name }}</span>
    </a>

    <ul class="nav-links" aria-label="Primary navigation">
      @for (item of navItems; track item.href) {
        <li>
          <a
            [href]="item.href"
            [class.is-active]="activeSection() === item.href.replace('#', '')"
            (click)="selectNav(item.href)"
          >
            {{ item.label }}
          </a>
        </li>
      }
    </ul>

    <div class="nav-actions">
      <button
        class="theme-toggle"
        type="button"
        appMagnetic
        [appMagnetic]="18"
        (click)="toggleTheme()"
        [attr.aria-label]="isDarkMode() ? 'Switch to light mode' : 'Switch to dark mode'"
      >
        <i class="fa-solid" [class.fa-sun]="isDarkMode()" [class.fa-moon]="!isDarkMode()"></i>
      </button>

      <a class="resume-link" appMagnetic [href]="person.resumeUrl" target="_blank" rel="noopener noreferrer">
        <i class="fa-regular fa-file-lines" aria-hidden="true"></i>
        <span>Resume</span>
      </a>

      <button
        class="menu-toggle"
        type="button"
        (click)="toggleMenu()"
        [attr.aria-expanded]="isMenuOpen()"
        aria-label="Toggle navigation menu"
      >
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </div>

  @if (isMenuOpen()) {
    <div class="mobile-panel">
      <ul aria-label="Mobile navigation">
        @for (item of navItems; track item.href) {
          <li>
            <a
              [href]="item.href"
              [class.is-active]="activeSection() === item.href.replace('#', '')"
              (click)="selectNav(item.href)"
            >
              {{ item.label }}
            </a>
          </li>
        }
        <li>
          <a class="mobile-resume" appMagnetic [href]="person.resumeUrl" target="_blank" rel="noopener noreferrer">
            <i class="fa-regular fa-file-lines" aria-hidden="true"></i>
            Resume
          </a>
        </li>
      </ul>
    </div>
  }
</nav>
